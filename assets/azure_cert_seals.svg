<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 130" width="100%" height="130" fill="none">
  <defs>
    <!-- Shimmer Light Sweep -->
    <linearGradient id="shimmerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Card 1 Gradient (AI-900 Teal Blue) -->
    <linearGradient id="cardGrad900" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4FBFA"/>
      <stop offset="100%" stop-color="#E6F7F5"/>
    </linearGradient>

    <!-- Card 2 Gradient (AI-103 Azure Blue) -->
    <linearGradient id="cardGrad103" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3F8FE"/>
      <stop offset="100%" stop-color="#E5F0FD"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes shimmerSweep {
      0% { transform: translateX(-350px); }
      30%, 100% { transform: translateX(880px); }
    }
    .shimmer-band {
      animation: shimmerSweep 5s ease-in-out infinite;
    }

    .cert-heading {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 800;
      font-size: 17px;
      fill: #0F172A;
    }
    .cert-sub {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #0078D4;
    }
    .cert-desc {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 500;
      font-size: 11.5px;
      fill: #475569;
    }
    .verified-badge {
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-weight: 700;
      font-size: 10px;
      letter-spacing: 0.8px;
    }
  </style>

  <!-- CARD 1: Microsoft Azure AI-900 Certified (X=10 to 415) -->
  <g transform="translate(10, 10)">
    <rect width="405" height="110" rx="12" fill="url(#cardGrad900)" stroke="#A7F3D0" stroke-width="1.4"/>
    
    <!-- Microsoft / Cloud Emblem -->
    <rect x="18" y="20" width="46" height="46" rx="10" fill="#0D9488"/>
    <!-- Azure Cloud Icon Shape -->
    <path d="M 33 48 C 30 48 27 46 27 42 C 27 38 30 36 33 36 C 34 32 38 29 43 29 C 48 29 52 32 53 36 C 56 36 58 39 58 42 C 58 45 56 48 53 48 Z" fill="#FFFFFF"/>
    <text x="31" y="44" font-family="sans-serif" font-size="8" font-weight="900" fill="#0D9488">AI</text>

    <!-- Content Block -->
    <text x="76" y="32" class="verified-badge" fill="#059669">✓ PASS · OFFICIAL MICROSOFT CERTIFIED</text>
    <text x="76" y="54" class="cert-heading">Microsoft Azure</text>
    <text x="76" y="73" class="cert-sub">AI-900 Certified</text>
    <text x="76" y="93" class="cert-desc">Azure AI Fundamentals &amp; Machine Learning Core</text>

    <!-- Clip Path for Card 1 Shimmer -->
    <g clip-path="url(#cardClip1)">
      <clipPath id="cardClip1">
        <rect width="405" height="110" rx="12"/>
      </clipPath>
      <rect class="shimmer-band" x="0" y="0" width="120" height="110" fill="url(#shimmerGrad)" transform="skewX(-20)"/>
    </g>
  </g>

  <!-- CARD 2: Microsoft Azure AI-103 Certified (X=445 to 850) -->
  <g transform="translate(445, 10)">
    <rect width="405" height="110" rx="12" fill="url(#cardGrad103)" stroke="#BAE6FD" stroke-width="1.4"/>

    <!-- Microsoft / Azure Emblem -->
    <rect x="18" y="20" width="46" height="46" rx="10" fill="#0284C7"/>
    <!-- Solution Architect Gear / Star Shape -->
    <path d="M 41 28 L 44 35 L 51 36 L 46 41 L 47 48 L 41 45 L 35 48 L 36 41 L 31 36 L 38 35 Z" fill="#FFFFFF"/>
    <text x="35" y="43" font-family="sans-serif" font-size="8" font-weight="900" fill="#0284C7">AI</text>

    <!-- Content Block -->
    <text x="76" y="32" class="verified-badge" fill="#0284C7">✓ PASS · OFFICIAL MICROSOFT CERTIFIED</text>
    <text x="76" y="54" class="cert-heading">Microsoft Azure</text>
    <text x="76" y="73" class="cert-sub">AI-103 Certified</text>
    <text x="76" y="93" class="cert-desc">Designing &amp; Implementing Azure AI Solutions</text>

    <!-- Clip Path for Card 2 Shimmer -->
    <g clip-path="url(#cardClip2)">
      <clipPath id="cardClip2">
        <rect width="405" height="110" rx="12"/>
      </clipPath>
      <rect class="shimmer-band" x="0" y="0" width="120" height="110" fill="url(#shimmerGrad)" transform="skewX(-20)"/>
    </g>
  </g>
</svg>
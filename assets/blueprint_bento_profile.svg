<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 680" width="100%" height="680" fill="none">
<defs>

      <!-- Technical Drafting Millimeter Grid -->
      <pattern id="draftGridFine" width="10" height="10" patternUnits="userSpaceOnUse">
        <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#EFECE6" stroke-width="0.5"/>
      </pattern>
      <pattern id="draftGridMajor" width="50" height="50" patternUnits="userSpaceOnUse">
        <rect width="50" height="50" fill="url(#draftGridFine)"/>
        <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#E2DED6" stroke-width="0.8"/>
      </pattern>

      <!-- Flow Bus Animation -->
      <linearGradient id="flowPulse" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#0066CC" stop-opacity="0.1"/>
        <stop offset="50%" stop-color="#0066CC" stop-opacity="0.9"/>
        <stop offset="100%" stop-color="#0066CC" stop-opacity="0.1"/>
      </linearGradient>

      <!-- Soft Shadow -->
      <filter id="subtleShadow" x="-5%" y="-5%" width="110%" height="110%">
        <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#14171A" flood-opacity="0.04"/>
      </filter>
    
</defs>

      <style>
        @keyframes signalTravel {
          0% { stroke-dashoffset: 160; }
          100% { stroke-dashoffset: 0; }
        }
        @keyframes pulseLedLive {
          0%, 100% { opacity: 1; transform: scale(1); }
          50% { opacity: 0.35; transform: scale(0.9); }
        }
        @keyframes waveOscillate {
          0%, 100% { d: path("M 0 12 Q 15 3 30 12 T 60 12 T 90 12 T 120 12 T 150 12"); }
          50% { d: path("M 0 12 Q 15 21 30 12 T 60 12 T 90 3 T 120 12 T 150 12"); }
        }

        .mono { font-family: ui-monospace, SFMono-Regular, "Geist Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
        .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Geist", Helvetica, Arial, sans-serif; }
        
        .pulse-led {
          transform-origin: 978px 36px;
          animation: pulseLedLive 1.8s ease-in-out infinite;
        }
        .signal-wire {
          stroke: #0066CC;
          stroke-width: 2;
          stroke-dasharray: 8 152;
          animation: signalTravel 2.8s linear infinite;
        }
        .audio-wave {
          animation: waveOscillate 2.2s ease-in-out infinite;
        }
        .bento-card {
          fill: #FFFFFF;
          stroke: #E2DFD8;
          stroke-width: 1.2;
          rx: 6px;
          filter: url(#subtleShadow);
        }
        .dim-line { stroke: #0066CC; stroke-width: 0.8; stroke-dasharray: 2 2; }
      </style>
    

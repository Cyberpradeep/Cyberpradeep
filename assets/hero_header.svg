<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" width="100%" height="260" fill="none">
  <defs>
    <!-- Linear Gradient for Accents -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F7FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00B8D9" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0.95"/>
    </linearGradient>
    
    <!-- Subtle Grid Pattern -->
    <pattern id="headerGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#30363d" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulseGreen {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.9); }
    }
    @keyframes blinkCursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes scanline {
      0% { transform: translateX(-920px); }
      100% { transform: translateX(920px); }
    }
    @keyframes telemetryPulse {
      0%, 100% { stroke-opacity: 0.3; }
      50% { stroke-opacity: 0.8; }
    }

    .mono { font-family: ui-monospace, SFMono-Regular, "Geist Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Geist", Helvetica, Arial, sans-serif; }
    
    .status-pulse {
      transform-origin: 825px 28px;
      animation: pulseGreen 2.4s ease-in-out infinite;
    }
    .cursor-blink {
      animation: blinkCursor 1s infinite;
    }
    .scan-runner {
      animation: scanline 4s linear infinite;
    }
    .card-border {
      animation: telemetryPulse 3s ease-in-out infinite;
    }
  </style>

  <!-- Background Base Container -->
  <rect x="1" y="1" width="918" height="258" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>
  <rect x="2" y="2" width="916" height="256" rx="11" fill="url(#headerGrid)"/>
  <rect x="2" y="2" width="916" height="256" rx="11" fill="url(#gridGrad)"/>

  <!-- Top Window Chrome / Terminal Bar -->
  <path d="M 1 13 C 1 6.37 6.37 1 13 1 L 907 1 C 913.63 1 919 6.37 919 13 L 919 42 L 1 42 Z" fill="#161b22"/>
  <line x1="1" y1="42" x2="919" y2="42" stroke="#30363d" stroke-width="1"/>

  <!-- Window Control Dots -->
  <circle cx="24" cy="21" r="5" fill="#f85149" fill-opacity="0.8"/>
  <circle cx="40" cy="21" r="5" fill="#d29922" fill-opacity="0.8"/>
  <circle cx="56" cy="21" r="5" fill="#3fb950" fill-opacity="0.8"/>

  <!-- Terminal Path Breadcrumb -->
  <text x="82" y="26" fill="#8b949e" font-size="11" class="mono" font-weight="500">pradeep@mesh-node-01: ~ / portfolio / core</text>

  <!-- Live Status Badge (Top Right) -->
  <rect x="735" y="12" width="168" height="20" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <circle cx="750" cy="22" r="3.5" fill="#3fb950" class="status-pulse"/>
  <text x="762" y="26" fill="#f0f6fc" font-size="10" class="mono" font-weight="600">SYSTEM: OPERATIONAL</text>

  <!-- Hero Content Section -->
  <!-- Domain Eyebrow Tag -->
  <g transform="translate(32, 74)">
    <rect x="0" y="0" width="310" height="22" rx="4" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
    <text x="12" y="15" fill="#00F7FF" font-size="11" class="mono" font-weight="600" letter-spacing="1">CYBER SECURITY × AGENTIC SYSTEMS</text>
  </g>

  <!-- Main Headline -->
  <text x="32" y="132" fill="#f0f6fc" font-size="34" class="sans" font-weight="700" letter-spacing="-0.5">
    Hey, I'm Pradeep <tspan fill="#00F7FF">.</tspan>
  </text>

  <!-- Subheadline -->
  <text x="32" y="162" fill="#8b949e" font-size="15" class="mono" font-weight="400">
    Currently debugging life one agent at a time <tspan fill="#00F7FF" class="cursor-blink">█</tspan>
  </text>

  <!-- Metadata Subtitle (MEC + Elverve) -->
  <text x="32" y="186" fill="#6e7681" font-size="12" class="mono">
    Final-Year B.E. CSE (Cyber Security) @ MEC (2027)  ·  Interning @ Elverve Technologies
  </text>

  <!-- Bottom Telemetry Ticker Container -->
  <g transform="translate(16, 208)">
    <rect x="0" y="0" width="888" height="38" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    
    <!-- Animated Scan Light across bottom border -->
    <rect x="0" y="37" width="140" height="1" fill="#00F7FF" class="scan-runner"/>

    <!-- Telemetry Metric 1 -->
    <g transform="translate(20, 14)">
      <circle cx="4" cy="5" r="3" fill="#00F7FF"/>
      <text x="14" y="9" fill="#8b949e" font-size="11" class="mono">ORCHESTRATION: <tspan fill="#f0f6fc" font-weight="600">DETERMINISTIC GRAPH</tspan></text>
    </g>

    <!-- Telemetry Metric 2 -->
    <g transform="translate(325, 14)">
      <circle cx="4" cy="5" r="3" fill="#3fb950"/>
      <text x="14" y="9" fill="#8b949e" font-size="11" class="mono">POLICY GATE: <tspan fill="#f0f6fc" font-weight="600">ZERO-TRUST DLP ACTIVE</tspan></text>
    </g>

    <!-- Telemetry Metric 3 -->
    <g transform="translate(640, 14)">
      <circle cx="4" cy="5" r="3" fill="#bc8cff"/>
      <text x="14" y="9" fill="#8b949e" font-size="11" class="mono">MINDSET: <tspan fill="#00F7FF" font-weight="600">LOGS &gt; VIBES</tspan></text>
    </g>
  </g>
</svg>

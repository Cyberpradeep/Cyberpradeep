<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" width="100%" height="240" fill="none">
  <defs>
    <pattern id="tacGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1c2333" stroke-width="0.6"/>
      <circle cx="20" cy="20" r="0.8" fill="#2d3748"/>
    </pattern>
    <linearGradient id="tacLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff9d" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff3366" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes tacticalPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.9); }
    }
    @keyframes alertGlow {
      0%, 100% { stroke-opacity: 0.4; }
      50% { stroke-opacity: 0.9; }
    }
    @keyframes cursorFlash {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .mono { font-family: ui-monospace, SFMono-Regular, "Geist Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }

    .pulse-green {
      transform-origin: 870px 22px;
      animation: tacticalPulse 1.8s ease-in-out infinite;
    }
    .cursor-blink { animation: cursorFlash 0.8s infinite; }
    .bracket { stroke: #00f0ff; stroke-width: 1.5; fill: none; }
  </style>

  <!-- Obsidian Base Plate -->
  <rect x="1" y="1" width="918" height="238" rx="8" fill="#08090d" stroke="#1c2333" stroke-width="1.2"/>
  <rect x="2" y="2" width="916" height="236" rx="7" fill="url(#tacGrid)"/>

  <!-- Tactical HUD Corner Brackets -->
  <path d="M 12 28 L 12 12 L 28 12" class="bracket"/>
  <path d="M 908 28 L 908 12 L 892 12" class="bracket"/>
  <path d="M 12 212 L 12 228 L 28 228" class="bracket"/>
  <path d="M 908 212 L 908 228 L 892 228" class="bracket"/>

  <!-- Top System Telemetry Bar -->
  <line x1="2" y1="36" x2="918" y2="36" stroke="#1c2333" stroke-width="1"/>
  
  <text x="36" y="24" fill="#00f0ff" font-size="10.5" class="mono" font-weight="700" letter-spacing="1">
    OPERATOR: CYBERPRADEEP // NODE_ID: 0x930
  </text>
  <text x="340" y="24" fill="#8b949e" font-size="10" class="mono">
    TARGET: OFFENSIVE AGENT AUDIT &amp; DETERMINISTIC DEFENSE
  </text>

  <!-- Live Status LED -->
  <rect x="760" y="12" width="138" height="20" rx="4" fill="#0f131a" stroke="#1c2333" stroke-width="1"/>
  <circle cx="774" cy="22" r="3.5" fill="#00ff9d" class="pulse-green"/>
  <text x="786" y="25" fill="#00ff9d" font-size="9.5" class="mono" font-weight="700">ARMED &amp; ONLINE</text>

  <!-- Main Headline Block -->
  <g transform="translate(36, 62)">
    <!-- Identity Badge -->
    <rect x="0" y="0" width="310" height="20" rx="3" fill="#121722" stroke="#252f44" stroke-width="0.8"/>
    <text x="10" y="14" fill="#00ff9d" font-size="9.5" class="mono" font-weight="700" letter-spacing="1">
      B.E. CSE (CYBER SECURITY) '27 · MEC
    </text>

    <!-- Name / Callsign -->
    <text x="0" y="56" fill="#f0f6fc" font-size="34" class="sans" font-weight="800" letter-spacing="-0.5">
      Pradeep <tspan fill="#00f0ff">//</tspan> Cyberpradeep
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="0" y="84" fill="#8b949e" font-size="13" class="mono">
      Debugging life, breaking rogue models, and engineering zero-trust agentic systems <tspan fill="#00f0ff" class="cursor-blink">█</tspan>
    </text>

    <!-- Role & Affiliation -->
    <text x="0" y="106" fill="#6e7681" font-size="11.5" class="mono">
      Interning @ <tspan fill="#f0f6fc" font-weight="600">Elverve Technologies</tspan>  ·  Tamil Nadu, India
    </text>
  </g>

  <!-- Dual Microsoft Certifications Badge (Top-Right Hero) -->
  <g transform="translate(585, 58)">
    <rect x="0" y="0" width="298" height="68" rx="6" fill="#0d1117" stroke="#238636" stroke-width="1.2"/>
    <rect x="1" y="1" width="296" height="4" fill="#238636"/>
    
    <text x="14" y="22" fill="#00ff9d" font-size="9.5" class="mono" font-weight="700" letter-spacing="1">
      MICROSOFT CERTIFIED DOUBLE TITLE
    </text>
    
    <!-- Cert 1: AI-900 -->
    <g transform="translate(14, 34)">
      <rect x="0" y="0" width="128" height="22" rx="3" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
      <circle cx="10" cy="11" r="3" fill="#00ff9d"/>
      <text x="20" y="15" fill="#f0f6fc" font-size="10.5" class="mono" font-weight="600">AI-900 PASS ✓</text>
    </g>

    <!-- Cert 2: AI-103 -->
    <g transform="translate(152, 34)">
      <rect x="0" y="0" width="132" height="22" rx="3" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
      <circle cx="10" cy="11" r="3" fill="#00ff9d"/>
      <text x="20" y="15" fill="#f0f6fc" font-size="10.5" class="mono" font-weight="600">AI-103 PASS ✓</text>
    </g>
  </g>

  <!-- Bottom Tactical Ticker -->
  <line x1="2" y1="196" x2="918" y2="196" stroke="#1c2333" stroke-width="1"/>
  <rect x="2" y="197" width="916" height="40" fill="#0c0e14"/>
  
  <g transform="translate(36, 218)">
    <circle cx="4" cy="4" r="3" fill="#00f0ff"/>
    <text x="14" y="7" fill="#8b949e" font-size="10.5" class="mono">
      ORCHESTRATION: <tspan fill="#f0f6fc" font-weight="600">DETERMINISTIC GRAPH HUB</tspan>
    </text>

    <circle cx="340" cy="4" r="3" fill="#00ff9d"/>
    <text x="350" y="7" fill="#8b949e" font-size="10.5" class="mono">
      AST GATE: <tspan fill="#f0f6fc" font-weight="600">ZERO SECRETS LEAKED</tspan>
    </text>

    <circle cx="650" cy="4" r="3" fill="#ff3366"/>
    <text x="660" y="7" fill="#8b949e" font-size="10.5" class="mono">
      CORE PROTOCOL: <tspan fill="#ff3366" font-weight="700">LOGS &gt; VIBES</tspan>
    </text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" width="100%" height="330" fill="none">
  <defs>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121620"/>
      <stop offset="100%" stop-color="#08090d"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes termBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .mono { font-family: ui-monospace, SFMono-Regular, "Geist Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
    .cursor { animation: termBlink 1s infinite; }
  </style>

  <!-- Container Box -->
  <rect x="1" y="1" width="918" height="328" rx="8" fill="#08090d" stroke="#1c2333" stroke-width="1.2"/>
  
  <!-- Terminal Top Bar -->
  <path d="M 1 8 C 1 4 4 1 8 1 L 912 1 C 916 1 919 4 919 8 L 919 36 L 1 36 Z" fill="#0f131a"/>
  <line x1="1" y1="36" x2="919" y2="36" stroke="#1c2333" stroke-width="1"/>

  <!-- Control Dots -->
  <circle cx="20" cy="18" r="4.5" fill="#ff3366" opacity="0.8"/>
  <circle cx="34" cy="18" r="4.5" fill="#d29922" opacity="0.8"/>
  <circle cx="48" cy="18" r="4.5" fill="#00ff9d" opacity="0.8"/>

  <!-- Tab Label -->
  <rect x="75" y="8" width="230" height="22" rx="4" fill="#08090d" stroke="#1c2333" stroke-width="0.8"/>
  <text x="90" y="23" fill="#8b949e" font-size="10.5" class="mono">cyberpradeep@agent-mesh: ~</text>

  <!-- Shell Path Indicator -->
  <text x="825" y="23" fill="#6e7681" font-size="10" class="mono">zsh · 80x24</text>

  <!-- Terminal Content Body -->
  <g transform="translate(24, 60)">
    <!-- Command 1: whoami -->
    <text x="0" y="0" fill="#00f0ff" font-size="12" class="mono" font-weight="700">&gt; whoami</text>
    <text x="0" y="20" fill="#f0f6fc" font-size="11.5" class="mono">
      final-year student, Muthayammal Engineering College (2027 batch)
    </text>
    <text x="0" y="38" fill="#8b949e" font-size="11.5" class="mono">
      specializing in Cyber Security, currently building inside <tspan fill="#00f0ff">GenAI</tspan> &amp; <tspan fill="#00ff9d">Voice AI</tspan> systems
    </text>

    <!-- Command 2: cat current_focus.log -->
    <text x="0" y="74" fill="#00f0ff" font-size="12" class="mono" font-weight="700">&gt; cat current_focus.log</text>

    <!-- Log entry 1 -->
    <text x="0" y="96" font-size="11.5" class="mono">
      <tspan fill="#d29922">[focus]</tspan>      <tspan fill="#8b949e">multi-agent orchestration patterns</tspan> <tspan fill="#f0f6fc">(hub-and-spoke, deterministic state boundaries)</tspan>
    </text>

    <!-- Log entry 2 -->
    <text x="0" y="116" font-size="11.5" class="mono">
      <tspan fill="#d29922">[focus]</tspan>      <tspan fill="#8b949e">RAG internals —</tspan> <tspan fill="#f0f6fc">hybrid search, reranking, chunking strategies that don't fall apart</tspan>
    </text>

    <!-- Log entry 3 -->
    <text x="0" y="136" font-size="11.5" class="mono">
      <tspan fill="#d29922">[focus]</tspan>      <tspan fill="#8b949e">voice pipelines —</tspan> <tspan fill="#f0f6fc">STT/TTS latency budgets, turn-taking, interruption handling</tspan>
    </text>

    <!-- Log entry 4 -->
    <text x="0" y="156" font-size="11.5" class="mono">
      <tspan fill="#00ff9d">[certified]</tspan>  <tspan fill="#8b949e">Microsoft Azure Track —</tspan> <tspan fill="#00f0ff">AI-900 (Certified ✓)</tspan> <tspan fill="#6e7681">·</tspan> <tspan fill="#00ff9d">AI-103 (Certified ✓)</tspan>
    </text>

    <!-- Log entry 5 (The Core Rule) -->
    <text x="0" y="176" font-size="11.5" class="mono">
      <tspan fill="#ff3366">[rule]</tspan>       <tspan fill="#f0f6fc">asking &quot;where does this break in production&quot; before &quot;does this demo work&quot;</tspan>
    </text>

    <!-- Command 3: philosophy -->
    <text x="0" y="212" fill="#00f0ff" font-size="12" class="mono" font-weight="700">&gt; cat /etc/mantra</text>
    <text x="0" y="232" fill="#8b949e" font-size="11.5" class="mono">
      &quot;test against real logs, not vibes.&quot; <tspan fill="#00f0ff" class="cursor">█</tspan>
    </text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 70" width="100%" height="70" fill="none">
  <defs>
    <!-- Sticky Note Yellow -->
    <linearGradient id="stickyNote" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0"/>
      <stop offset="100%" stop-color="#FBF2C4"/>
    </linearGradient>

    <!-- Washi Tape -->
    <linearGradient id="footerTape" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2D0AF" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#EFE2CA" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#DFCCA9" stop-opacity="0.85"/>
    </linearGradient>

    <filter id="stickyShadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <style>
    .hand-quote {
      font-family: 'Caveat', 'Segoe Print', cursive, sans-serif;
      font-size: 20px;
      font-weight: 700;
      fill: #422006;
    }
    .motto-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12px;
      font-weight: 600;
      fill: #78350F;
    }
  </style>

  <!-- Sticky Note Card -->
  <g filter="url(#stickyShadow)" transform="rotate(-0.8 340 35)">
    <rect x="40" y="10" width="600" height="52" rx="8" fill="url(#stickyNote)" stroke="#EADCA6" stroke-width="1.2"/>
    
    <!-- Top Tape Pin -->
    <polygon points="300,4 380,4 376,18 296,18" fill="url(#footerTape)"/>

    <!-- Coffee Cup Icon -->
    <text x="65" y="43" font-size="22">☕</text>

    <!-- Text Quote -->
    <text x="100" y="36" class="hand-quote">"Understand the task. Reason what's next. Make it happen."</text>
    <text x="100" y="52" class="motto-sub">Pradeep Selladurai · Junior Software Engineer Intern · See you in the next commit! ☺</text>
  </g>
</svg>
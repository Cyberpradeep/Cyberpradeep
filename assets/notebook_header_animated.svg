<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 230" width="100%" height="230" fill="none">
  <defs>
    <!-- Leather / Paper Tone Gradients -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFBF7"/>
      <stop offset="100%" stop-color="#F4EFE6"/>
    </linearGradient>

    <!-- Spiral Ring 3D Gradient -->
    <linearGradient id="spiralRing" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6B7280"/>
      <stop offset="30%" stop-color="#E5E7EB"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#9CA3AF"/>
      <stop offset="100%" stop-color="#374151"/>
    </linearGradient>

    <!-- Washi Tape Texture -->
    <linearGradient id="washiTape" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EAD9BA" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#F6EBD5" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#E4D2B0" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Paper Shadow -->
    <filter id="pageShadow" x="-3%" y="-5%" width="106%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600&amp;family=Fira+Code:wght@500;600&amp;family=Plus+Jakarta+Sans:wght@500;700;800&amp;display=swap');

    .title {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 800;
      font-size: 30px;
      fill: #1A1613;
    }
    .hand-accent {
      font-family: 'Caveat', 'Segoe Print', 'Comic Sans MS', cursive, sans-serif;
      font-size: 22px;
      fill: #A05A2C;
      font-weight: 600;
    }
    .role-badge {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      font-size: 13px;
      font-weight: 700;
      fill: #0F5132;
    }
    .terminal-text {
      font-family: 'Fira Code', ui-monospace, SFMono-Regular, monospace;
      font-size: 13.5px;
      font-weight: 500;
      fill: #1E293B;
    }
    .subtext {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      font-size: 13px;
      font-weight: 500;
      fill: #5C554E;
    }

    /* Live Pulse Indicator */
    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.4; }
    }
    .pulse-core {
      transform-origin: 864px 44px;
      animation: pulseGlow 2s ease-in-out infinite;
    }

    /* Typewriter Cycle */
    @keyframes typeLine1 {
      0%, 30% { opacity: 1; }
      33%, 100% { opacity: 0; }
    }
    @keyframes typeLine2 {
      0%, 32% { opacity: 0; }
      35%, 63% { opacity: 1; }
      66%, 100% { opacity: 0; }
    }
    @keyframes typeLine3 {
      0%, 65% { opacity: 0; }
      68%, 97% { opacity: 1; }
      100% { opacity: 0; }
    }
    .type-1 { animation: typeLine1 12s infinite; }
    .type-2 { animation: typeLine2 12s infinite; }
    .type-3 { animation: typeLine3 12s infinite; }

    /* Blinking Cursor */
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .cursor { animation: blink 0.8s infinite; }
  </style>

  <!-- Notebook Page Base with Drop Shadow -->
  <rect x="20" y="16" width="900" height="198" rx="14" fill="url(#paperGrad)" stroke="#DFD7CA" stroke-width="1.5" filter="url(#pageShadow)"/>

  <!-- Left Spiral Binding Margin & Perforation -->
  <line x1="84" y1="16" x2="84" y2="214" stroke="#E5DEC9" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="86" y1="16" x2="86" y2="214" stroke="#F87171" stroke-width="1.2" opacity="0.6"/>

  <!-- Metallic Spiral Binding Rings (Left Edge) -->
  <g>
    <!-- Ring 1 -->
    <ellipse cx="50" cy="40" rx="20" ry="6" fill="#000000" opacity="0.15"/>
    <rect x="34" y="32" width="32" height="10" rx="5" fill="url(#spiralRing)" stroke="#4B5563" stroke-width="0.8"/>
    <circle cx="50" cy="37" r="3.5" fill="#2B2118"/>

    <!-- Ring 2 -->
    <ellipse cx="50" cy="88" rx="20" ry="6" fill="#000000" opacity="0.15"/>
    <rect x="34" y="80" width="32" height="10" rx="5" fill="url(#spiralRing)" stroke="#4B5563" stroke-width="0.8"/>
    <circle cx="50" cy="85" r="3.5" fill="#2B2118"/>

    <!-- Ring 3 -->
    <ellipse cx="50" cy="136" rx="20" ry="6" fill="#000000" opacity="0.15"/>
    <rect x="34" y="128" width="32" height="10" rx="5" fill="url(#spiralRing)" stroke="#4B5563" stroke-width="0.8"/>
    <circle cx="50" cy="133" r="3.5" fill="#2B2118"/>

    <!-- Ring 4 -->
    <ellipse cx="50" cy="184" rx="20" ry="6" fill="#000000" opacity="0.15"/>
    <rect x="34" y="176" width="32" height="10" rx="5" fill="url(#spiralRing)" stroke="#4B5563" stroke-width="0.8"/>
    <circle cx="50" cy="181" r="3.5" fill="#2B2118"/>
  </g>

  <!-- Washi Tape Accents (Top Right & Left) -->
  <polygon points="760,10 840,10 836,28 756,28" fill="url(#washiTape)" opacity="0.85" transform="rotate(-3 798 19)"/>
  <polygon points="120,10 180,10 177,26 117,26" fill="url(#washiTape)" opacity="0.85" transform="rotate(2 148 18)"/>

  <!-- Content Block (Left Margin Starts at X=112) -->
  <!-- Name & Hand-drawn greeting -->
  <text x="112" y="58" class="hand-accent">Hey there! Welcome to my notebook ✏️</text>
  <text x="112" y="96" class="title">Pradeep Selladurai</text>

  <!-- Role Pill & Status -->
  <g transform="translate(112, 110)">
    <!-- Pill 1: Current Role -->
    <rect x="0" y="0" width="280" height="26" rx="13" fill="#D1E7DD" stroke="#A3CFBB" stroke-width="1"/>
    <circle cx="13" cy="13" r="4.5" fill="#198754"/>
    <text x="26" y="17" class="role-badge">Junior Software Engineer Intern @ Elverve</text>

    <!-- Pill 2: Education -->
    <rect x="290" y="0" width="250" height="26" rx="13" fill="#E8EDF5" stroke="#C5D2E7" stroke-width="1"/>
    <text x="304" y="17" class="subtext" font-weight="600" fill="#2C4E80">🎓 B.E. CSE (Cyber Sec) '27</text>

    <!-- Pill 3: Focus Area -->
    <rect x="548" y="0" width="186" height="26" rx="13" fill="#FFF3CD" stroke="#FFE69C" stroke-width="1"/>
    <text x="560" y="17" class="subtext" font-weight="600" fill="#7A5600">⚡ AI Agents &amp; Voice AI</text>
  </g>

  <!-- Live Dynamic Typewriter Strip (Notebook Terminal) -->
  <g transform="translate(112, 152)">
    <rect x="0" y="0" width="776" height="42" rx="8" fill="#FFFFFF" stroke="#E2DACD" stroke-width="1.2"/>
    <rect x="0" y="0" width="6" height="42" rx="3" fill="#0066CC"/>

    <!-- Terminal Prompt Icon -->
    <text x="18" y="26" font-family="'Fira Code', monospace" font-size="14" font-weight="700" fill="#0066CC">&gt;</text>

    <!-- Typewriter Message 1 -->
    <g class="type-1">
      <text x="36" y="26" class="terminal-text">Building autonomous AI agents, voice pipelines (Gemini Live), and secure architectures.</text>
    </g>

    <!-- Typewriter Message 2 -->
    <g class="type-2">
      <text x="36" y="26" class="terminal-text">Muthayammal Engineering College · Final Year Cyber Security · Salem &amp; Coimbatore, TN</text>
    </g>

    <!-- Typewriter Message 3 -->
    <g class="type-3">
      <text x="36" y="26" class="terminal-text">Microsoft Certified: Azure AI-103 &amp; Azure AI-900 · Practical Problem Solver</text>
    </g>

    <!-- Blinking Cursor -->
    <rect class="cursor" x="760" y="14" width="8" height="16" fill="#0066CC" rx="1"/>
  </g>

  <!-- Live Status Badge (Top Right) -->
  <g transform="translate(730, 36)">
    <rect x="0" y="0" width="168" height="26" rx="13" fill="#E6F4EA" stroke="#A8DAB5" stroke-width="1"/>
    <!-- Animated Glow Dot -->
    <circle class="pulse-core" cx="16" cy="13" r="5" fill="#34A853"/>
    <circle cx="16" cy="13" r="3.5" fill="#137333"/>
    <text x="30" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#137333">ONLINE &amp; BUILDING</text>
  </g>
</svg>
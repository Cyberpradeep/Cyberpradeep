<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 80" width="100%" height="80" fill="none">
  <defs>
    <linearGradient id="stripGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#121620"/>
      <stop offset="100%" stop-color="#08090d"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes pulseRing {
      0%, 100% { stroke-opacity: 0.4; }
      50% { stroke-opacity: 1; }
    }
    .mono { font-family: ui-monospace, SFMono-Regular, "Geist Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
    .pulse-stroke { animation: pulseRing 2s ease-in-out infinite; }
  </style>

  <!-- Container -->
  <rect x="1" y="1" width="918" height="78" rx="8" fill="#08090d" stroke="#1c2333" stroke-width="1.2"/>

  <!-- Badge 1: Location & Language -->
  <g transform="translate(16, 17)">
    <rect x="0" y="0" width="220" height="46" rx="6" fill="#0f131a" stroke="#1c2333" stroke-width="0.8"/>
    <text x="14" y="18" fill="#6e7681" font-size="9" class="mono" font-weight="700" letter-spacing="1">LOCATION &amp; LANGUAGE</text>
    <text x="14" y="35" fill="#f0f6fc" font-size="11.5" class="mono" font-weight="600">Tamil Nadu, IN · Tamil • EN</text>
  </g>

  <!-- Badge 2: Current Role -->
  <g transform="translate(248, 17)">
    <rect x="0" y="0" width="220" height="46" rx="6" fill="#0f131a" stroke="#1c2333" stroke-width="0.8"/>
    <text x="14" y="18" fill="#6e7681" font-size="9" class="mono" font-weight="700" letter-spacing="1">CURRENT ROLE</text>
    <text x="14" y="35" fill="#00f0ff" font-size="11.5" class="mono" font-weight="600">Intern @ Elverve Tech</text>
  </g>

  <!-- Badge 3: Academic Track -->
  <g transform="translate(480, 17)">
    <rect x="0" y="0" width="200" height="46" rx="6" fill="#0f131a" stroke="#1c2333" stroke-width="0.8"/>
    <text x="14" y="18" fill="#6e7681" font-size="9" class="mono" font-weight="700" letter-spacing="1">ACADEMIC TRACK</text>
    <text x="14" y="35" fill="#f0f6fc" font-size="11.5" class="mono" font-weight="600">B.E. CSE (CyberSec) '27</text>
  </g>

  <!-- Badge 4: Dual Microsoft Certified -->
  <g transform="translate(692, 17)">
    <rect x="0" y="0" width="212" height="46" rx="6" fill="#0f131a" stroke="#238636" stroke-width="1.2" class="pulse-stroke"/>
    <text x="14" y="18" fill="#00ff9d" font-size="9" class="mono" font-weight="700" letter-spacing="1">MICROSOFT DUAL CERTIFIED</text>
    <text x="14" y="35" fill="#f0f6fc" font-size="11.5" class="mono" font-weight="700">AI-900 <tspan fill="#00ff9d">✓</tspan> <tspan fill="#6e7681">·</tspan> AI-103 <tspan fill="#00ff9d">✓</tspan> <tspan fill="#00ff9d">[PASS]</tspan></text>
  </g>
</svg>

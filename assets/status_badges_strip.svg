<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 80" width="100%" height="80" fill="none">
  <defs>
    <linearGradient id="stripGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes pulseRing {
      0%, 100% { stroke-opacity: 0.3; }
      50% { stroke-opacity: 1; }
    }
    .mono { font-family: ui-monospace, SFMono-Regular, "Geist Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
    .pulse-stroke { animation: pulseRing 2.5s ease-in-out infinite; }
  </style>

  <!-- Container -->
  <rect x="1" y="1" width="918" height="78" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- Badge 1: Location & Language -->
  <g transform="translate(16, 18)">
    <rect x="0" y="0" width="235" height="44" rx="6" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
    <text x="14" y="18" fill="#6e7681" font-size="9" class="mono" font-weight="600" letter-spacing="0.5">LOCATION &amp; LANGUAGE</text>
    <text x="14" y="34" fill="#f0f6fc" font-size="11.5" class="mono" font-weight="500">Tamil Nadu, IN · Tamil • EN</text>
  </g>

  <!-- Badge 2: Internship -->
  <g transform="translate(263, 18)">
    <rect x="0" y="0" width="225" height="44" rx="6" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
    <text x="14" y="18" fill="#6e7681" font-size="9" class="mono" font-weight="600" letter-spacing="0.5">CURRENT ROLE</text>
    <text x="14" y="34" fill="#00F7FF" font-size="11.5" class="mono" font-weight="500">Intern @ Elverve Tech</text>
  </g>

  <!-- Badge 3: Academic Track -->
  <g transform="translate(500, 18)">
    <rect x="0" y="0" width="200" height="44" rx="6" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
    <text x="14" y="18" fill="#6e7681" font-size="9" class="mono" font-weight="600" letter-spacing="0.5">EDUCATION</text>
    <text x="14" y="34" fill="#f0f6fc" font-size="11.5" class="mono" font-weight="500">B.E. CSE (CyberSec) '27</text>
  </g>

  <!-- Badge 4: Certifications -->
  <g transform="translate(712, 18)">
    <rect x="0" y="0" width="192" height="44" rx="6" fill="#161b22" stroke="#00F7FF" stroke-width="0.8" class="pulse-stroke"/>
    <text x="14" y="18" fill="#3fb950" font-size="9" class="mono" font-weight="600" letter-spacing="0.5">CERTIFICATION STATUS</text>
    <text x="14" y="34" fill="#f0f6fc" font-size="11.5" class="mono" font-weight="600">AI-900 <tspan fill="#3fb950">✓</tspan> <tspan fill="#6e7681">·</tspan> AI-103 <tspan fill="#d29922">⟳</tspan></text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="280" fill="none">
  <defs>
    <pattern id="toolkitGridTac" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.6" fill="#1c2333" fill-opacity="0.6"/>
    </pattern>
  </defs>

  <style>
    @keyframes subtlePulse {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }
    .mono { font-family: ui-monospace, SFMono-Regular, "Geist Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
    .matrix-card {
      fill: #0f131a;
      stroke: #1c2333;
      stroke-width: 1;
    }
    .status-dot {
      animation: subtlePulse 2.5s ease-in-out infinite;
    }
  </style>

  <!-- Container -->
  <rect x="1" y="1" width="918" height="278" rx="8" fill="#08090d" stroke="#1c2333" stroke-width="1.2"/>
  <rect x="2" y="2" width="916" height="276" rx="7" fill="url(#toolkitGridTac)"/>

  <!-- Top Bar -->
  <path d="M 1 8 C 1 4 4 1 8 1 L 912 1 C 916 1 919 4 919 8 L 919 36 L 1 36 Z" fill="#0f131a"/>
  <line x1="1" y1="36" x2="919" y2="36" stroke="#1c2333" stroke-width="1"/>

  <text x="24" y="23" fill="#f0f6fc" font-size="11.5" class="mono" font-weight="700">
    STACK &amp; TOOLKIT MATRIX  <tspan fill="#6e7681">// PRODUCTION &amp; RESEARCH STACKS</tspan>
  </text>
  <text x="750" y="23" fill="#00ff9d" font-size="10" class="mono" font-weight="600">ZERO-TRUST AUDIT</text>

  <!-- COLUMN 1: AGENTIC -->
  <g transform="translate(20, 52)">
    <rect x="0" y="0" width="205" height="205" rx="6" class="matrix-card"/>
    <path d="M 0 5 C 0 2.2 2.2 0 5 0 L 200 0 C 202.8 0 205 2.2 205 5 L 205 26 L 0 26 Z" fill="#08090d"/>
    <line x1="0" y1="26" x2="205" y2="26" stroke="#1c2333" stroke-width="1"/>
    
    <circle cx="14" cy="13" r="3" fill="#00f0ff" class="status-dot"/>
    <text x="24" y="16" fill="#00f0ff" font-size="10" class="mono" font-weight="700">01 / ORCHESTRATION</text>

    <g transform="translate(14, 42)">
      <text x="0" y="0" fill="#f0f6fc" font-size="11.5" class="mono">Python 3.12</text>
      <text x="0" y="26" fill="#f0f6fc" font-size="11.5" class="mono">FastAPI</text>
      <text x="0" y="52" fill="#f0f6fc" font-size="11.5" class="mono">LangGraph State Nodes</text>
      <text x="0" y="78" fill="#f0f6fc" font-size="11.5" class="mono">Deterministic Gates</text>
      <text x="0" y="104" fill="#8b949e" font-size="11.5" class="mono">Async Task Workers</text>
      <text x="0" y="130" fill="#8b949e" font-size="11.5" class="mono">Node.js / TypeScript</text>
    </g>
  </g>

  <!-- COLUMN 2: RETRIEVAL -->
  <g transform="translate(245, 52)">
    <rect x="0" y="0" width="205" height="205" rx="6" class="matrix-card"/>
    <path d="M 0 5 C 0 2.2 2.2 0 5 0 L 200 0 C 202.8 0 205 2.2 205 5 L 205 26 L 0 26 Z" fill="#08090d"/>
    <line x1="0" y1="26" x2="205" y2="26" stroke="#1c2333" stroke-width="1"/>
    
    <circle cx="14" cy="13" r="3" fill="#bc8cff" class="status-dot"/>
    <text x="24" y="16" fill="#bc8cff" font-size="10" class="mono" font-weight="700">02 / RETRIEVAL &amp; RAG</text>

    <g transform="translate(14, 42)">
      <text x="0" y="0" fill="#f0f6fc" font-size="11.5" class="mono">Qdrant Vector DB</text>
      <text x="0" y="26" fill="#f0f6fc" font-size="11.5" class="mono">BM25 Sparse Search</text>
      <text x="0" y="52" fill="#f0f6fc" font-size="11.5" class="mono">Reciprocal Rank Fusion</text>
      <text x="0" y="78" fill="#f0f6fc" font-size="11.5" class="mono">Cross-Encoder Rerank</text>
      <text x="0" y="104" fill="#8b949e" font-size="11.5" class="mono">Semantic Chunking</text>
      <text x="0" y="130" fill="#8b949e" font-size="11.5" class="mono">MarkItDown Parser</text>
    </g>
  </g>

  <!-- COLUMN 3: REAL-TIME VOICE -->
  <g transform="translate(470, 52)">
    <rect x="0" y="0" width="205" height="205" rx="6" class="matrix-card"/>
    <path d="M 0 5 C 0 2.2 2.2 0 5 0 L 200 0 C 202.8 0 205 2.2 205 5 L 205 26 L 0 26 Z" fill="#08090d"/>
    <line x1="0" y1="26" x2="205" y2="26" stroke="#1c2333" stroke-width="1"/>
    
    <circle cx="14" cy="13" r="3" fill="#00ff9d" class="status-dot"/>
    <text x="24" y="16" fill="#00ff9d" font-size="10" class="mono" font-weight="700">03 / REAL-TIME VOICE</text>

    <g transform="translate(14, 42)">
      <text x="0" y="0" fill="#f0f6fc" font-size="11.5" class="mono">Pipecat Framework</text>
      <text x="0" y="26" fill="#f0f6fc" font-size="11.5" class="mono">WebRTC Audio Feeds</text>
      <text x="0" y="52" fill="#f0f6fc" font-size="11.5" class="mono">STT / TTS Pipelines</text>
      <text x="0" y="78" fill="#f0f6fc" font-size="11.5" class="mono">VAD (Voice Activity)</text>
      <text x="0" y="104" fill="#8b949e" font-size="11.5" class="mono">Turn-Taking Logic</text>
      <text x="0" y="130" fill="#8b949e" font-size="11.5" class="mono">Latency Budgeting</text>
    </g>
  </g>

  <!-- COLUMN 4: SECURITY & INFRA -->
  <g transform="translate(695, 52)">
    <rect x="0" y="0" width="205" height="205" rx="6" class="matrix-card"/>
    <path d="M 0 5 C 0 2.2 2.2 0 5 0 L 200 0 C 202.8 0 205 2.2 205 5 L 205 26 L 0 26 Z" fill="#08090d"/>
    <line x1="0" y1="26" x2="205" y2="26" stroke="#1c2333" stroke-width="1"/>
    
    <circle cx="14" cy="13" r="3" fill="#00ff9d" class="status-dot"/>
    <text x="24" y="16" fill="#00ff9d" font-size="10" class="mono" font-weight="700">04 / SECURITY &amp; INFRA</text>

    <g transform="translate(14, 42)">
      <text x="0" y="0" fill="#00ff9d" font-size="11.5" class="mono" font-weight="700">Azure AI-900 (Cert ✓)</text>
      <text x="0" y="26" fill="#00ff9d" font-size="11.5" class="mono" font-weight="700">Azure AI-103 (Cert ✓)</text>
      <text x="0" y="52" fill="#f0f6fc" font-size="11.5" class="mono">DLP Secret Masking</text>
      <text x="0" y="78" fill="#f0f6fc" font-size="11.5" class="mono">AST Sandboxing</text>
      <text x="0" y="104" fill="#8b949e" font-size="11.5" class="mono">Docker &amp; Linux</text>
      <text x="0" y="130" fill="#8b949e" font-size="11.5" class="mono">Redis &amp; WinRM/SSH</text>
    </g>
  </g>
</svg>

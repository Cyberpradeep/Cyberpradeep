<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="280" fill="none">
  <defs>
    <pattern id="toolkitDots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.6" fill="#30363d" fill-opacity="0.4"/>
    </pattern>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F7FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00F7FF" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes subtlePulse {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }
    @keyframes barGlow {
      0%, 100% { stroke-opacity: 0.3; }
      50% { stroke-opacity: 0.8; }
    }

    .mono { font-family: ui-monospace, SFMono-Regular, "Geist Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Geist", Helvetica, Arial, sans-serif; }

    .matrix-card {
      fill: #161b22;
      stroke: #30363d;
      stroke-width: 1;
    }
    .skill-pill {
      fill: #0d1117;
      stroke: #30363d;
      stroke-width: 0.8;
    }
    .status-dot {
      animation: subtlePulse 2.5s ease-in-out infinite;
    }
  </style>

  <!-- Container -->
  <rect x="1" y="1" width="918" height="278" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>
  <rect x="2" y="2" width="916" height="276" rx="9" fill="url(#toolkitDots)"/>

  <!-- Top Window Header -->
  <path d="M 1 9 C 1 4.5 4.5 1 9 1 L 911 1 C 915.5 1 919 4.5 919 9 L 919 36 L 1 36 Z" fill="#161b22"/>
  <line x1="1" y1="36" x2="919" y2="36" stroke="#30363d" stroke-width="1"/>

  <text x="24" y="23" fill="#f0f6fc" font-size="11.5" class="mono" font-weight="600">
    STACK &amp; TOOLKIT MATRIX  <tspan fill="#6e7681">// PRODUCTION &amp; RESEARCH STACKS</tspan>
  </text>
  <text x="760" y="23" fill="#00F7FF" font-size="10" class="mono">VERIFIED ARCHITECTURE</text>

  <!-- ==================== COLUMN 1: AGENTIC & BACKEND ==================== -->
  <g transform="translate(20, 52)">
    <rect x="0" y="0" width="205" height="205" rx="8" class="matrix-card"/>
    <path d="M 0 6 C 0 2.7 2.7 0 6 0 L 199 0 C 202.3 0 205 2.7 205 6 L 205 26 L 0 26 Z" fill="#0d1117"/>
    <line x1="0" y1="26" x2="205" y2="26" stroke="#30363d" stroke-width="1"/>
    
    <circle cx="14" cy="13" r="3" fill="#00F7FF" class="status-dot"/>
    <text x="24" y="16" fill="#00F7FF" font-size="10" class="mono" font-weight="600">01 / ORCHESTRATION</text>

    <!-- Skills List -->
    <g transform="translate(14, 42)">
      <text x="0" y="0" fill="#f0f6fc" font-size="11.5" class="mono">Python 3.12</text>
      <text x="0" y="26" fill="#f0f6fc" font-size="11.5" class="mono">FastAPI</text>
      <text x="0" y="52" fill="#f0f6fc" font-size="11.5" class="mono">LangGraph / State Graphs</text>
      <text x="0" y="78" fill="#f0f6fc" font-size="11.5" class="mono">Deterministic Gates</text>
      <text x="0" y="104" fill="#8b949e" font-size="11.5" class="mono">Async Task Workers</text>
      <text x="0" y="130" fill="#8b949e" font-size="11.5" class="mono">Node.js / TypeScript</text>
    </g>
  </g>

  <!-- ==================== COLUMN 2: RETRIEVAL & DATA ==================== -->
  <g transform="translate(245, 52)">
    <rect x="0" y="0" width="205" height="205" rx="8" class="matrix-card"/>
    <path d="M 0 6 C 0 2.7 2.7 0 6 0 L 199 0 C 202.3 0 205 2.7 205 6 L 205 26 L 0 26 Z" fill="#0d1117"/>
    <line x1="0" y1="26" x2="205" y2="26" stroke="#30363d" stroke-width="1"/>
    
    <circle cx="14" cy="13" r="3" fill="#bc8cff" class="status-dot"/>
    <text x="24" y="16" fill="#bc8cff" font-size="10" class="mono" font-weight="600">02 / RETRIEVAL &amp; RAG</text>

    <!-- Skills List -->
    <g transform="translate(14, 42)">
      <text x="0" y="0" fill="#f0f6fc" font-size="11.5" class="mono">Qdrant Vector DB</text>
      <text x="0" y="26" fill="#f0f6fc" font-size="11.5" class="mono">BM25 Sparse Search</text>
      <text x="0" y="52" fill="#f0f6fc" font-size="11.5" class="mono">Reciprocal Rank Fusion</text>
      <text x="0" y="78" fill="#f0f6fc" font-size="11.5" class="mono">Cross-Encoder Rerank</text>
      <text x="0" y="104" fill="#8b949e" font-size="11.5" class="mono">Semantic Chunking</text>
      <text x="0" y="130" fill="#8b949e" font-size="11.5" class="mono">MarkItDown Parser</text>
    </g>
  </g>

  <!-- ==================== COLUMN 3: REAL-TIME VOICE AI ==================== -->
  <g transform="translate(470, 52)">
    <rect x="0" y="0" width="205" height="205" rx="8" class="matrix-card"/>
    <path d="M 0 6 C 0 2.7 2.7 0 6 0 L 199 0 C 202.3 0 205 2.7 205 6 L 205 26 L 0 26 Z" fill="#0d1117"/>
    <line x1="0" y1="26" x2="205" y2="26" stroke="#30363d" stroke-width="1"/>
    
    <circle cx="14" cy="13" r="3" fill="#3fb950" class="status-dot"/>
    <text x="24" y="16" fill="#3fb950" font-size="10" class="mono" font-weight="600">03 / REAL-TIME VOICE</text>

    <!-- Skills List -->
    <g transform="translate(14, 42)">
      <text x="0" y="0" fill="#f0f6fc" font-size="11.5" class="mono">Pipecat Framework</text>
      <text x="0" y="26" fill="#f0f6fc" font-size="11.5" class="mono">WebRTC Audio Feeds</text>
      <text x="0" y="52" fill="#f0f6fc" font-size="11.5" class="mono">STT / TTS Pipelines</text>
      <text x="0" y="78" fill="#f0f6fc" font-size="11.5" class="mono">VAD (Voice Activity)</text>
      <text x="0" y="104" fill="#8b949e" font-size="11.5" class="mono">Turn-Taking Logic</text>
      <text x="0" y="130" fill="#8b949e" font-size="11.5" class="mono">Latency Budgeting</text>
    </g>
  </g>

  <!-- ==================== COLUMN 4: SECURITY & INFRA ==================== -->
  <g transform="translate(695, 52)">
    <rect x="0" y="0" width="205" height="205" rx="8" class="matrix-card"/>
    <path d="M 0 6 C 0 2.7 2.7 0 6 0 L 199 0 C 202.3 0 205 2.7 205 6 L 205 26 L 0 26 Z" fill="#0d1117"/>
    <line x1="0" y1="26" x2="205" y2="26" stroke="#30363d" stroke-width="1"/>
    
    <circle cx="14" cy="13" r="3" fill="#f85149" class="status-dot"/>
    <text x="24" y="16" fill="#f85149" font-size="10" class="mono" font-weight="600">04 / SECURITY &amp; INFRA</text>

    <!-- Skills List -->
    <g transform="translate(14, 42)">
      <text x="0" y="0" fill="#00F7FF" font-size="11.5" class="mono" font-weight="600">Azure AI-900 (Cert)</text>
      <text x="0" y="26" fill="#d29922" font-size="11.5" class="mono">Azure AI-103 (Prep)</text>
      <text x="0" y="52" fill="#f0f6fc" font-size="11.5" class="mono">DLP &amp; Secret Redaction</text>
      <text x="0" y="78" fill="#f0f6fc" font-size="11.5" class="mono">AST Sandboxing</text>
      <text x="0" y="104" fill="#8b949e" font-size="11.5" class="mono">Docker &amp; Linux</text>
      <text x="0" y="130" fill="#8b949e" font-size="11.5" class="mono">Redis &amp; WinRM/SSH</text>
    </g>
  </g>
</svg>

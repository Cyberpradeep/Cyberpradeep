<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 54" width="420" height="54" fill="none">
  <defs>
    <linearGradient id="voiceBarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
  </defs>

  <style>
    .mono-label {
      font-family: ui-monospace, SFMono-Regular, "Geist Mono", monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    
    @keyframes soundwave {
      0%, 100% { transform: scaleY(0.25); }
      50% { transform: scaleY(1.0); }
    }
    .bar {
      transform-origin: 27px;
      animation: soundwave 1.1s ease-in-out infinite;
      rx: 2;
      fill: url(#voiceBarGrad);
    }
    .b-1 { animation-delay: 0.05s; }
    .b-2 { animation-delay: 0.25s; }
    .b-3 { animation-delay: 0.45s; }
    .b-4 { animation-delay: 0.15s; }
    .b-5 { animation-delay: 0.60s; }
    .b-6 { animation-delay: 0.35s; }
    .b-7 { animation-delay: 0.50s; }
    .b-8 { animation-delay: 0.20s; }
  </style>

  <!-- Container Pill -->
  <rect x="1" y="1" width="418" height="52" rx="10" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.5"/>

  <!-- Left Telemetry Label -->
  <circle cx="20" cy="27" r="4.5" fill="#0284C7"/>
  <text x="32" y="24" class="mono-label" fill="#0369A1">VOICE AI DUPLEX STREAM</text>
  <text x="32" y="38" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#0284C7">Gemini Live · FastAPI · WebRTC · &lt;140ms</text>

  <!-- Waveform Visualizer (Right Side) -->
  <g transform="translate(320, 0)">
    <rect class="bar b-1" x="0"  y="14" width="4" height="26" />
    <rect class="bar b-2" x="8"  y="9"  width="4" height="36" />
    <rect class="bar b-3" x="16" y="6"  width="4" height="42" />
    <rect class="bar b-4" x="24" y="12" width="4" height="30" />
    <rect class="bar b-5" x="32" y="8"  width="4" height="38" />
    <rect class="bar b-6" x="40" y="15" width="4" height="24" />
    <rect class="bar b-7" x="48" y="10" width="4" height="34" />
    <rect class="bar b-8" x="56" y="17" width="4" height="20" />
  </g>
</svg>